<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'OAuth2 GitHub Demo'">OAuth2 GitHub Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <a th:href="@{/}" class="brand">Spring Security OAuth2 GitHub</a>
    <nav>
        <a th:href="@{/public}">Public</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/me}">/me JSON</a>
        <span sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit">Logout</button>
            </form>
        </span>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
    </nav>
</header>
<main class="container">
    <section th:fragment="content"></section>
</main>
</body>
</html>
