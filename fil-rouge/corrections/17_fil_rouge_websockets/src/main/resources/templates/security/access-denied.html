<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accès refusé</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<main class="container narrow">
    <header class="page-header">
        <div>
            <p class="surtitle">Spring Security</p>
            <h1>Accès refusé</h1>
            <p>Votre utilisateur est authentifié mais ne possède pas le rôle nécessaire.</p>
        </div>
    </header>

    <section class="card">
        <p>Essayez par exemple de générer ou supprimer un duplicata avec le compte <code>user/user</code>.</p>
        <div class="actions">
            <a class="button secondary" th:href="@{/ui/duplicatas}">Retour à la liste</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="button" type="submit">Changer d'utilisateur</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
