# ============================================================================
# Application fil rouge - version Spring Boot + Spring Data JPA
# ============================================================================

spring.application.name=duplicata-impots
server.port=8080

# Propriete metier deja utilisee par le service DuplicataService.
cdn.url=https://cdn.prod.impots

# ============================================================================
# Configuration H2
# ============================================================================
spring.datasource.url=jdbc:h2:mem:duplicatasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web H2 exposee automatiquement par Boot.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================================
# Configuration JPA / Hibernate
# ============================================================================
# Pour le TP, Hibernate cree le schema a partir des annotations @Entity.
# En production, on prefererait Flyway ou Liquibase.
spring.jpa.hibernate.ddl-auto=create

# Affiche le SQL genere par Hibernate dans la console.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demande a Spring Boot d'executer data.sql apres la creation du schema JPA.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ============================================================================
# Thymeleaf
# ============================================================================
spring.thymeleaf.cache=false

# Logs utiles en formation.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================================
# OpenAPI / Swagger UI
# ============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Active le support ProblemDetail de Spring MVC pour certaines erreurs gerees par le framework.
spring.mvc.problemdetails.enabled=true

# ============================================================================
# Cache Spring
# ============================================================================
# Pour le TP, on utilise le cache simple en memoire fourni par Spring Boot.
# Ce cache est suffisant pour comprendre @Cacheable / @CacheEvict.
spring.cache.type=simple
spring.cache.cache-names=duplicatas,duplicataParId,duplicatasParUser,duplicatasParMontant,duplicatasRecherche,duplicatasJpql,duplicatasProjections,duplicatasPage

# ============================================================================
# Spring Boot Actuator
# ============================================================================
# En formation, on expose plusieurs endpoints pour les observer depuis le navigateur.
# En production, il faut limiter fortement cette liste et proteger /actuator/**.
management.endpoints.web.exposure.include=health,info,metrics,caches,beans,mappings,env,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.defaults.enabled=true

# Endpoints de disponibilite Kubernetes-like : /actuator/health/liveness et readiness.
management.endpoint.health.probes.enabled=true

# Active les informations provenant des proprietes info.* ci-dessous.
management.info.env.enabled=true
info.app.name=Duplicata Impots
info.app.description=Application fil rouge de generation de duplicatas d'impots
# Prise en compte du statut custom DEGRADED renvoye par DuplicataHealthIndicator.
management.endpoint.health.status.order=down,out-of-service,degraded,unknown,up
management.endpoint.health.status.http-mapping.degraded=200


# ============================================================================
# Securite JWT REST
# ============================================================================
# Secret pedagogique pour signer les tokens HMAC SHA-256.
# En production, utiliser une valeur longue, aleatoire, externe au code source.
app.security.jwt.secret=formation-spring-jwt-secret-change-me-1234567890
app.security.jwt.expiration-seconds=3600

# ============================================================================
# OAuth2 Login GitHub - front MVC
# ============================================================================
# Le Client ID peut rester visible dans le projet de TP.
# Le Client Secret ne doit pas etre commite en clair : on le fournit via variable d'environnement.
# Callback GitHub a declarer dans l'application OAuth GitHub :
# http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liZfHPLcitSHTJRl}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
info.app.version=19-tests
info.app.training.module=Tests unitaires et tests integration
