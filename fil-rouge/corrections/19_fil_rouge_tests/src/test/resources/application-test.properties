# Profil de test : on garde H2 en memoire et on réduit le bruit SQL.
spring.datasource.url=jdbc:h2:mem:duplicatasdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
cdn.url=https://cdn.test.impots
app.security.jwt.secret=secret-de-test-assez-long-pour-la-signature-jwt
app.security.jwt.expiration-seconds=3600
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
