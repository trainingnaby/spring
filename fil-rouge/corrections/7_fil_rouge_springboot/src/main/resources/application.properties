cdn.url=https://cdn.prod.impots

# Configuration JDBC H2 sans Spring Boot
jdbc.driverClassName=org.h2.Driver
jdbc.url=jdbc:h2:mem:duplicatasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
jdbc.username=sa
jdbc.password=


spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Console web H2 exposee automatiquement par Boot.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================================
# Thymeleaf
# ============================================================================
# Boot configure automatiquement le prefixe classpath:/templates/ et le suffixe .html.
# On desactive simplement le cache pour faciliter les modifications pendant le TP.
spring.thymeleaf.cache=false


# Logs utiles en formation.
logging.level.org.springframework.jdbc.core=DEBUG
