# ============================================================================
# Application fil rouge - version Spring Boot + Spring Data JPA
# ============================================================================

spring.application.name=duplicata-impots
server.port=8080

# Propriete metier deja utilisee par le service DuplicataService.
cdn.url=https://cdn.prod.impots

# ============================================================================
# Configuration H2
# ============================================================================
spring.datasource.url=jdbc:h2:mem:duplicatasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web H2 exposee automatiquement par Boot.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================================
# Configuration JPA / Hibernate
# ============================================================================
# Pour le TP, Hibernate cree le schema a partir des annotations @Entity.
# En production, on prefererait Flyway ou Liquibase.
spring.jpa.hibernate.ddl-auto=create

# Affiche le SQL genere par Hibernate dans la console.
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Demande a Spring Boot d'executer data.sql apres la creation du schema JPA.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ============================================================================
# Thymeleaf
# ============================================================================
spring.thymeleaf.cache=false

# Logs utiles en formation.
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================================
# OpenAPI / Swagger UI
# ============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

